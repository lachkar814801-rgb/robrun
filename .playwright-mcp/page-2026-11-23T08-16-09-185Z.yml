              - text: (Google Ireland Ltd / Google LLC), for Google Analytics 4, only with your consent.
            - listitem [ref=e294]:
              - strong [ref=e295]: Microsoft Corporation
              - text: ", for Microsoft Clarity, only with your consent."
            - listitem [ref=e296]:
              - strong [ref=e297]: Our email provider
              - text: ", which hosts the support@robrun.space mailbox."
          - paragraph [ref=e298]: Some providers process data in the United States. Where required, transfers rely on the EU–US Data Privacy Framework (and its UK and Swiss extensions) and/or the European Commission's Standard Contractual Clauses. We may also disclose data if the law requires it, or to protect the Site and its visitors from fraud or abuse.
          - heading "5. Your rights" [level=2] [ref=e299]
          - paragraph [ref=e300]: "Depending on where you live (for example under the GDPR, UK GDPR or Swiss law), you can:"
          - list [ref=e301]:
            - listitem [ref=e302]: access the personal data we hold about you and get a copy;
            - listitem [ref=e303]: have inaccurate data corrected;
            - listitem [ref=e304]: have your data deleted;
            - listitem [ref=e305]: restrict or object to processing based on legitimate interests;
            - listitem [ref=e306]: receive your data in a portable format;
            - listitem [ref=e307]:
              - text: withdraw consent at any time, as easily as you gave it, in
              - button "Cookie settings" [ref=e308] [cursor=pointer]
              - text: . Withdrawing doesn't affect processing that already happened.
            - listitem [ref=e309]: complain to your local data protection authority.
          - paragraph [ref=e310]:
            - strong [ref=e311]: "California and other US states:"
            - text: we do not sell or “share” personal information for cross-context behavioural advertising and do not use sensitive personal information. You can still ask what we hold and ask us to delete it.
          - paragraph [ref=e312]:
            - text: To use any right, email
            - link "support@robrun.space" [ref=e313] [cursor=pointer]:
              - /url: mailto:support@robrun.space
            - text: . Analytics data is tied to a random cookie ID, not your name, so the quickest option is often to clear your cookies and reject analytics. We reply within one month.
          - heading "6. Children" [level=2] [ref=e314]
          - paragraph [ref=e315]: The Site is not aimed at children under 13 (or under 16 where local law sets a higher age for consenting to online services), and we don't knowingly collect their data. ROB RUN itself contains mature content. If you think a child has sent us personal data, contact us and we'll delete it.
          - heading "7. Security" [level=2] [ref=e316]
          - paragraph [ref=e317]: The Site is served only over HTTPS with modern security headers. Access to analytics and email accounts is limited and protected with two-factor authentication. No system is perfectly secure, but we take reasonable steps to protect data.
          - heading "8. Changes" [level=2] [ref=e318]
          - paragraph [ref=e319]: We'll update this policy if our practices change, for example if we add a contact form, accounts or comments. The date and version at the top will change. For material changes we'll show a notice and ask for consent again where needed.
