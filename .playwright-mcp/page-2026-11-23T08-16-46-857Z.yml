        - generic [ref=e202]:
          - paragraph [ref=e203]: Cette politique s’applique au site Rob Run Guide et tient compte des droits prévus par la loi générale sur la protection des données (LGPD) au Brésil et par le règlement général sur la protection des données (RGPD) en Europe, selon leur applicabilité à votre situation.
          - region "Projet et contact" [ref=e204]:
            - heading "Projet et contact" [level=2] [ref=e205]
            - paragraph [ref=e206]:
              - text: Rob Run Guide est un projet maintenu par la communauté. Pour toute question de confidentialité ou demande concernant vos données, contactez l’équipe qui maintient le guide à l’adresse
              - link "support@robrunguide.app" [ref=e207] [cursor=pointer]:
                - /url: mailto:support@robrunguide.app
              - text: .
            - paragraph [ref=e208]: Cette politique concerne l’utilisation du guide. Les comptes, serveurs et services du jeu ROB RUN et de Steam ont leurs propres politiques.
          - region "Quelles données utilisons-nous et pourquoi" [ref=e209]:
            - heading "Quelles données utilisons-nous et pourquoi" [level=2] [ref=e210]
            - generic [ref=e211]:
              - generic [ref=e212]:
                - term [ref=e213]: Fonctionnement et sécurité
                - definition [ref=e214]: Pour afficher les pages, nous traitons l’adresse IP et des informations techniques sur la connexion, comme le navigateur et les requêtes. L’infrastructure d’hébergement peut conserver des journaux d’erreurs et de sécurité pour diagnostiquer des défaillances et prévenir les abus. Ces usages répondent à l’intérêt légitime de maintenir un service disponible et sécurisé, dans le respect de vos droits.
              - generic [ref=e215]:
                - term [ref=e216]: Statistiques facultatives
                - definition [ref=e217]: Avec votre consentement uniquement, Google Analytics mesure l’utilisation des pages, des recherches, des filtres, des objets, des boutiques, des conseils, des cartes et des visionneuses 3D. Il peut traiter des identifiants de cookies, des informations sur l’appareil et une localisation approximative. Cela nous aide à choisir les contenus et fonctionnalités à améliorer.
              - generic [ref=e218]:
                - term [ref=e219]: Contact
                - definition [ref=e220]: Si vous nous envoyez un e-mail, nous recevons votre adresse, le message et les informations que vous choisissez de partager. Nous les utilisons pour répondre et, si nécessaire, traiter les demandes d’exercice des droits et satisfaire à des obligations légales. Envoyez uniquement ce qui est nécessaire à votre demande.
            - paragraph [ref=e221]: Le guide ne demande ni identifiant ni mot de passe Steam. Les événements de recherche transmis à Analytics ne contiennent qu’une tranche de longueur et le nombre de résultats, sans le texte saisi. Les événements de navigation ne contiennent ni paramètres de requête ni fragments d’URL. Les identifiants de contenu désignent les objets et lieux du guide, sans identifier les joueurs.
            - paragraph [ref=e222]:
              - text: Selon Google, GA4 utilise l’adresse IP lors de la collecte pour estimer la localisation, puis la supprime avant d’enregistrer les données. Cela ne rend pas anonymes toutes les données d’utilisation. Consultez les
              - link "paramètres de confidentialité de GA4" [ref=e223] [cursor=pointer]:
                - /url: https://support.google.com/analytics/answer/11598602?hl=pt-BR
              - text: .
          - region "Cookies et vos choix" [ref=e224]:
            - heading "Cookies et vos choix" [level=2] [ref=e225]
            - paragraph [ref=e226]: La balise Google Analytics ne se charge qu’après votre acceptation. Si vous refusez, toutes les fonctionnalités du guide restent accessibles. Les statistiques reposent sur le consentement, conformément à la LGPD et au RGPD. Ce choix n’autorise pas la publicité personnalisée.
            - generic [ref=e227]:
              - generic [ref=e228]:
                - term [ref=e229]: Préférence de confidentialité
                - definition [ref=e230]: Elle est conservée dans le stockage local du navigateur pendant 180 jours au maximum pour mémoriser votre acceptation ou votre refus. Elle n’est pas transmise à Google en tant qu’événement d’utilisation.
              - generic [ref=e231]:
                - term [ref=e232]: Cookies Analytics (_ga et _ga_*)
                - definition [ref=e233]: Utilisés après votre acceptation pour distinguer les navigateurs et les sessions. Leur durée est limitée à la période restante de votre préférence de 180 jours, sans renouvellement automatique à chaque visite.
            - paragraph [ref=e234]: Vous pouvez changer d’avis dans « Préférences de confidentialité », dans le pied de page et sur les cartes. Si vous retirez votre consentement après l’activation, nous cessons d’envoyer de nouveaux événements, supprimons les cookies Analytics accessibles au guide et rechargeons la page. Le retrait n’invalide pas le traitement antérieur et n’efface pas automatiquement les données déjà transmises.
            - button "Préférences de confidentialité" [ref=e293] [cursor=pointer]
            - paragraph [ref=e235]: Vous pouvez également bloquer les cookies ou effacer les données de ce site dans les paramètres du navigateur. Si vous effacez la préférence, le guide vous demandera de choisir à nouveau. Si votre choix ne peut pas être enregistré, l’interface signale le problème et indique comment effacer les données du site.
          - region "Services et transferts internationaux" [ref=e236]:
            - heading "Services et transferts internationaux" [level=2] [ref=e237]
            - paragraph [ref=e238]: Les services d’hébergement et de communication traitent les informations nécessaires pour fournir le site et répondre aux messages. Si vous acceptez les statistiques, Google reçoit les données d’utilisation décrites dans cette politique. L’intégration laisse Google Signals et la personnalisation publicitaire désactivés.
            - paragraph [ref=e239]:
              - text: Google peut traiter des informations dans d’autres pays, notamment en dehors du Brésil et de l’Espace économique européen. Les conditions de traitement et les mécanismes de transfert sont décrits dans les
              - link "conditions de traitement des données" [ref=e240] [cursor=pointer]:
                - /url: https://business.safety.google/adsprocessorterms/
              - text: et la
              - link "politique de confidentialité de Google" [ref=e241] [cursor=pointer]:
                - /url: https://policies.google.com/privacy
              - text: . Vous pouvez nous écrire à l’adresse de contact pour la confidentialité pour obtenir des précisions sur les services et les garanties applicables.
          - region "Conservation et sécurité" [ref=e242]:
            - heading "Conservation et sécurité" [level=2] [ref=e243]
            - paragraph [ref=e244]:
              - text: Les 180 jours mentionnés ci-dessus concernent la préférence et les cookies dans votre navigateur. Les données transmises à Google ont leur propre durée de conservation, définie dans la propriété Analytics. Les rapports agrégés peuvent être conservés plus longtemps. Supprimer les cookies n’efface pas ces données. Consultez les
              - link "règles de conservation d’Analytics" [ref=e245] [cursor=pointer]:
                - /url: https://support.google.com/analytics/answer/7667196?hl=pt-BR
              - text: ou renseignez-vous sur la configuration du guide.
            - paragraph [ref=e246]: Les messages et les journaux d’exploitation sont conservés le temps nécessaire pour répondre à la demande, examiner les problèmes, protéger le service et satisfaire aux éventuelles obligations légales. La durée dépend de la finalité et des exigences applicables.
            - paragraph [ref=e247]: Nous prenons des mesures techniques pour protéger le service et limiter l’accès aux informations. Aucun système n’offre une sécurité absolue. Si vous constatez un problème, signalez-le à notre contact pour la confidentialité.
          - region "Vos droits au Brésil et en Europe" [ref=e248]:
            - heading "Vos droits au Brésil et en Europe" [level=2] [ref=e249]
            - paragraph [ref=e250]: Vous pouvez présenter les demandes suivantes conformément à la législation applicable.
            - list [ref=e251]:
              - listitem [ref=e252]: Confirmation du traitement, accès à vos données et rectification de celles-ci.
              - listitem [ref=e253]: Effacement, anonymisation ou blocage des données dans les cas prévus par la loi.
              - listitem [ref=e254]: Informations sur le partage et la portabilité des données, le cas échéant.
              - listitem [ref=e255]: Opposition ou limitation du traitement et retrait du consentement, selon la base juridique et la législation applicables.
            - paragraph [ref=e256]:
              - text: Envoyez votre demande à
              - link "support@robrunguide.app" [ref=e257] [cursor=pointer]:
                - /url: mailto:support@robrunguide.app
              - text: . Nous pouvons avoir besoin d’informations proportionnées pour confirmer votre identité ou retrouver les données. Comme le guide n’exige pas de compte, nous ne pouvons pas toujours associer les événements d’un navigateur à une personne. Nous expliquerons les éventuelles limites et répondrons dans les délais légaux applicables. N’envoyez pas de mots de passe ni de documents sans demande justifiée.
            - paragraph [ref=e258]:
              - text: Au Brésil, vous pouvez également vous adresser à l’
              - link "ANPD" [ref=e259] [cursor=pointer]:
                - /url: https://www.gov.br/anpd/pt-br/canais_atendimento/cidadao-titular-de-dados/denuncia-peticao-de-titular-referente-lgpd
              - text: . Dans l’Union européenne, vous pouvez déposer une réclamation auprès de l’autorité de protection des données compétente, notamment dans le pays où vous résidez, travaillez ou où la violation présumée a eu lieu. Au Portugal, cette autorité est la
              - link "CNPD" [ref=e260] [cursor=pointer]:
                - /url: https://www.cnpd.pt/cidadaos/participacoes/
              - text: . Pour les autres pays, consultez la
              - link "liste des autorités nationales" [ref=e261] [cursor=pointer]:
                - /url: https://www.edpb.europa.eu/about-edpb/about-edpb/members_en
              - text: .
          - region "Publicité et modifications de cette politique" [ref=e262]:
            - heading "Publicité et modifications de cette politique" [level=2] [ref=e263]
            - paragraph [ref=e264]: Le guide ne charge pas encore d’annonces Google AdSense. Si nous ajoutons de la publicité, nous actualiserons cette politique et les options de consentement avant de commencer les nouveaux traitements.
            - paragraph [ref=e265]: Cette page peut évoluer avec le fonctionnement du guide et les exigences applicables. Nous signalerons les changements importants concernant les finalités ou les données collectées. Nous demanderons à nouveau votre consentement si nécessaire. La date en haut de la page indique la version actuelle.
